<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Known conditioning does not lock the generated output</title>
  <desc id="desc">Explanatory diagram of the mask branch only. The static scene video and an all-one known mask condition a DiT and numerical sampler. A separate noisy future-video latent is refined into a generated future that may change. The mask marks available input, not immutable output pixels. Robot RGB, scene depth, end-effector depth, text, and noise-level inputs are omitted from this diagram.</desc>
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#183138} .small{font-size:14px;fill:#53666a} .body{font-size:16px} .label{font-size:20px;font-weight:700} .line{fill:none;stroke:#197d75;stroke-width:2.5}
    </style>
  </defs>
  <rect width="960" height="430" rx="14" fill="#faf8f2"/>
  <text x="30" y="28" class="small">Explanatory diagram · mask branch only</text>
  <text x="30" y="61" font-size="25" font-weight="700">Known input ≠ locked output</text>
  <text x="30" y="88" class="body">The mask says which context is available; the model still generates a separate future.</text>

  <rect x="30" y="113" width="272" height="236" rx="12" fill="#edf5f2" stroke="#aac8c2"/>
  <text x="49" y="142" class="small" font-weight="700">KNOWN CONDITIONING</text>
  <rect x="48" y="159" width="236" height="73" rx="8" fill="#ffffff" stroke="#aac8c2"/>
  <text x="66" y="186" class="label">Static scene video</text>
  <text x="66" y="210" class="body">Initial scene across the clip</text>
  <rect x="48" y="249" width="236" height="80" rx="8" fill="#ffffff" stroke="#aac8c2"/>
  <text x="66" y="278" class="label">Known mask: m = 1</text>
  <text x="66" y="303" class="body">Every pixel, every frame</text>

  <rect x="363" y="113" width="238" height="81" rx="10" fill="#ffffff" stroke="#aac8c2"/>
  <text x="382" y="144" class="label">Noisy future latent</text>
  <text x="382" y="170" class="body">A separate output candidate</text>
  <path d="M482 194V235" class="line"/>
  <path d="M476 225L488 225L482 237Z" fill="#197d75"/>
  <rect x="363" y="241" width="238" height="108" rx="10" fill="#197d75"/>
  <text x="482" y="277" text-anchor="middle" font-size="21" font-weight="700" style="fill:#ffffff">DiT + sampler</text>
  <text x="482" y="303" text-anchor="middle" class="body" style="fill:#ffffff">Refine the future latent</text>
  <text x="482" y="326" text-anchor="middle" class="body" style="fill:#ffffff">using the known context</text>
  <path d="M302 295H357" class="line"/>
  <path d="M347 289L347 301L359 295Z" fill="#197d75"/>

  <path d="M601 295H661" class="line"/>
  <path d="M651 289L651 301L663 295Z" fill="#197d75"/>
  <text x="631" y="279" text-anchor="middle" class="small">decode</text>
  <rect x="668" y="241" width="262" height="108" rx="10" fill="#ffffff" stroke="#197d75" stroke-width="2"/>
  <text x="688" y="277" class="label">Generated future</text>
  <text x="688" y="305" class="body">Objects and occlusions</text>
  <text x="688" y="328" class="body">can change from the input.</text>

  <text x="30" y="383" class="body">“Known” describes the conditioning signal. It is not a hard copy rule for output pixels.</text>
  <text x="30" y="408" class="small">Robot RGB, scene depth, end-effector depth, text and noise-level inputs are omitted here.</text>
</svg>
