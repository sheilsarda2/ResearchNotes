<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Proposed robot-factored Daydream prototype</title>
  <desc id="desc">Current robot state and candidate commands feed robot-only controller replay. A shared calibrated camera feeds both the robot renderer and the initial-scene renderer. Their four output streams condition Daydream, which generates the interaction video.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#46635a" />
    </marker>
  </defs>
  <rect width="1200" height="790" rx="16" fill="#faf9f6" />
  <g fill="none" stroke="#46635a" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M175 114V143H285V180" />
    <path d="M395 114V143H285V180" />
    <path d="M285 254V330" />
    <path d="M985 114V330" />
    <path d="M520 217H490V367H420" />
    <path d="M750 217H800V367H850" />
    <path d="M285 404V445" />
    <path d="M985 404V445" />
    <path d="M285 519V540H635V565" />
    <path d="M985 519V540H635V565" />
    <path d="M635 639V688" />
  </g>
  <g stroke="#b6c7c0" stroke-width="1.5" fill="#eaf2ee">
    <rect x="80" y="40" width="190" height="74" rx="10" />
    <rect x="300" y="40" width="190" height="74" rx="10" />
    <rect x="150" y="180" width="270" height="74" rx="10" />
    <rect x="150" y="330" width="270" height="74" rx="10" />
    <rect x="150" y="445" width="270" height="74" rx="10" />
  </g>
  <g stroke="#b6c6d1" stroke-width="1.5" fill="#eef3f7">
    <rect x="850" y="40" width="270" height="74" rx="10" />
    <rect x="850" y="330" width="270" height="74" rx="10" />
    <rect x="850" y="445" width="270" height="74" rx="10" />
  </g>
  <rect x="520" y="180" width="230" height="74" rx="10" fill="#f3eddf" stroke="#cbbd9f" stroke-width="1.5" />
  <rect x="500" y="565" width="270" height="74" rx="10" fill="#193e33" />
  <rect x="500" y="688" width="270" height="74" rx="10" fill="#eaf2ee" stroke="#b6c7c0" stroke-width="1.5" />
  <g font-family="Arial, sans-serif" font-size="21" fill="#19372e" text-anchor="middle">
    <text x="175" y="72">Current robot</text>
    <text x="175" y="98">state</text>
    <text x="395" y="72">Candidate</text>
    <text x="395" y="98">commands</text>
    <text x="285" y="211">Robot-only</text>
    <text x="285" y="238">controller replay</text>
    <text x="635" y="211">Shared calibrated</text>
    <text x="635" y="238">camera</text>
    <text x="985" y="72">Current scene</text>
    <text x="985" y="98">RGB and depth</text>
    <text x="285" y="374">Robot renderer</text>
    <text x="985" y="361">Static scene branch</text>
    <text x="985" y="388">Repeat cutoff observation</text>
    <text x="285" y="476">Robot RGB</text>
    <text x="285" y="503">and EEF depth</text>
    <text x="985" y="476">Static RGB</text>
    <text x="985" y="503">and scene depth</text>
    <text x="635" y="596" fill="white">Daydream with</text>
    <text x="635" y="623" fill="white">factored conditions</text>
    <text x="635" y="719">Predicted</text>
    <text x="635" y="746">interaction video</text>
  </g>
  <text x="310" y="294" font-family="Arial, sans-serif" font-size="17" fill="#596c63">Nominal trajectory</text>
  <text x="36" y="750" font-family="Arial, sans-serif" font-size="17" fill="#596c63">Proposed fixed-camera prototype</text>
  <g fill="#46635a">
    <polygon points="285,180 280,170 290,170" />
    <polygon points="285,330 280,320 290,320" />
    <polygon points="985,330 980,320 990,320" />
    <polygon points="420,367 430,362 430,372" />
    <polygon points="850,367 840,362 840,372" />
    <polygon points="285,445 280,435 290,435" />
    <polygon points="985,445 980,435 990,435" />
    <polygon points="635,565 630,555 640,555" />
    <polygon points="635,688 630,678 640,678" />
  </g>
</svg>
