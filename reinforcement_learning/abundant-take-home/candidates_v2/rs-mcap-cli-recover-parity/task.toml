version = "1.0"

[metadata]
author_name = "Abundant Candidate Research"
author_email = ""
difficulty = "hard"
category = "software-engineering"
tags = ["rust", "form-a", "mcap", "cli", "recovery", "durability", "streaming", "differential-oracle", "foxglove"]
upstream = "https://github.com/foxglove/mcap/pull/1647"
base_commit = "cb59283917587746d0b94f0d73139762a1046f31"

[verifier]
timeout_sec = 3600.0

[agent]
timeout_sec = 21600.0

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 30720
# Contamination control: the merged upstream PR is public. On a backend with
# network_allowlist support, restrict agent egress to the model gateway:
#   network_mode = "allowlist"
#   allowed_hosts = ["take-home-automation.vercel.app"]
# The plain Docker backend supports only public/no-network, and the agent needs the
# gateway, so the default (public) is kept there; see STATUS.md.

[environment.env]
# Route model calls through the take-home gateway — keep this block in every
# task you author. These values reach all phases (agent, verifier, solution).
# The agent phase gets your ANTHROPIC_API_KEY from the terminal automatically;
# if your verifier or solution also needs to call the model (e.g. an
# LLM-as-judge verifier), add:  ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
# (harbor will ask to confirm host-environment access on each run; pass -y in
# scripts).
ANTHROPIC_BASE_URL = "https://take-home-automation.vercel.app"
ANTHROPIC_API_BASE = "https://take-home-automation.vercel.app"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 30720

[[artifacts]]
source = "/workspace/repo/rust/cli/src"
destination = "submission/rust/cli/src"

[[artifacts]]
source = "/workspace/repo/rust/mcap/src"
destination = "submission/rust/mcap/src"
