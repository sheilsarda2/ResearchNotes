version = "1.0"

[metadata]
author_name = "Sheil"
author_email = ""
difficulty = "hard"
category = "software-engineering"
tags = ["python", "form-a", "xarray", "zarr", "dask", "chunking", "io", "differential-oracle"]
upstream = "https://github.com/pydata/xarray"
upstream_prs = ["https://github.com/pydata/xarray/pull/10336", "https://github.com/pydata/xarray/pull/10516"]
base_commit = "d21d79e91646c883a2daff8faeb7f948080e73ed"

[agent]
timeout_sec = 21600.0

[verifier]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 30720

[environment.env]
# Route model calls through the take-home gateway — keep this block in every
# task you author. These values reach all phases (agent, verifier, solution).
# The agent phase gets your ANTHROPIC_API_KEY from the terminal automatically;
# if your verifier or solution also needs to call the model (e.g. an
# LLM-as-judge verifier), add:  ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
# (harbor will ask to confirm host-environment access on each run; pass -y in
# scripts).
ANTHROPIC_BASE_URL = "https://take-home-automation.vercel.app"
ANTHROPIC_API_BASE = "https://take-home-automation.vercel.app"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 30720

# Only the agent-editable package is transferred. Upstream tests are restored
# from the pristine copy inside the verifier image; hidden tests, the reference
# reader (zarr-python) and the harness never leave the verifier image.
[[artifacts]]
source = "/workspace/repo/xarray"
destination = "submission/xarray"
exclude = ["tests", "__pycache__", "*.pyc", "*.so", "*.pyd"]
