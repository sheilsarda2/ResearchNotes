version = "1.0"

[metadata]
author_name = "Abundant Candidate Research"
author_email = ""
difficulty = "hard"
category = "software-engineering"
tags = ["rust", "form-a", "burn-onnx", "onnx", "codegen", "gru", "lstm", "rnn", "differential-verification", "onnxruntime"]

[verifier]
timeout_sec = 3600.0

[agent]
timeout_sec = 21600.0

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 30720

[environment.env]
# Route model calls through the take-home gateway — keep this block in every
# task you author. These values reach all phases (agent, verifier, solution).
# The agent phase gets your ANTHROPIC_API_KEY from the terminal automatically;
# if your verifier or solution also needs to call the model (e.g. an
# LLM-as-judge verifier), add:  ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
# (harbor will ask to confirm host-environment access on each run; pass -y in
# scripts).
ANTHROPIC_BASE_URL = "https://take-home-automation.vercel.app"
ANTHROPIC_API_BASE = "https://take-home-automation.vercel.app"

# Separate offline verifier: its own image (tests/Dockerfile) with onnxruntime, the hidden
# PR tests and the differential corpus. Only the two agent-editable source directories are
# transferred; Harbor re-materializes them at the same paths inside the verifier container
# and test.sh rebuilds the crates clean-room around them.
[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 30720

[[artifacts]]
source = "/workspace/repo/crates/onnx-ir/src"
destination = "submission/onnx-ir-src"

[[artifacts]]
source = "/workspace/repo/crates/burn-onnx/src"
destination = "submission/burn-onnx-src"
