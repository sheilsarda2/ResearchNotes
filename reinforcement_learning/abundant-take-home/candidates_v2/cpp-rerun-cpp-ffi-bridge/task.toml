version = "1.0"

[metadata]
author_name = "Abundant Candidate Research"
author_email = ""
difficulty = "hard"
category = "software-engineering"
tags = ["cpp", "rerun", "form-b", "ffi", "arrow", "sdk", "cross-language-differential"]

[verifier]
# Incremental relink is minutes; a public-header change forces a full SDK + snippets rebuild (~20 min on 4 cpus),
# then 112 snippet runs and 104 rrd comparisons.
timeout_sec = 5400.0

[agent]
# Build cycles are long (relink ~2 min, full rebuild after a header edit ~15-20 min); 8 hours.
timeout_sec = 28800.0

[environment]
# Image build compiles rerun_c + rerun-cli + Rust snippets (release), Arrow 18 (debug) and the whole C++ SDK
# object set. Estimated 70-100 minutes on 4 cpus; see STATUS.md.
build_timeout_sec = 10800.0
cpus = 4
memory_mb = 8192
storage_mb = 30720

[environment.env]
# Route model calls through the take-home gateway — keep this block in every
# task you author. These values reach all phases (agent, verifier, solution).
# The agent phase gets your ANTHROPIC_API_KEY from the terminal automatically;
# if your verifier or solution also needs to call the model (e.g. an
# LLM-as-judge verifier), add:  ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
# (harbor will ask to confirm host-environment access on each run; pass -y in
# scripts).
ANTHROPIC_BASE_URL = "https://take-home-automation.vercel.app"
ANTHROPIC_API_BASE = "https://take-home-automation.vercel.app"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 10800
cpus = 4
memory_mb = 8192
storage_mb = 30720

# Only the agent-editable SDK sources are transferred; Harbor re-materializes them at the same path inside the
# verifier container, where test.sh restores the generated code, the C header directory and all tests from a
# pristine copy before rebuilding.
[[artifacts]]
source = "/workspace/repo/rerun_cpp/src"
destination = "submission/rerun_cpp_src"
exclude = ["*.o", "*.a", "*.so", "*.rrd", ".cache"]
