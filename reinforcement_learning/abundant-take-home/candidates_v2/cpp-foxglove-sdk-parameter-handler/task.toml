version = "1.0"

[metadata]
author_name = "Abundant Candidate Research"
author_email = ""
difficulty = "hard"
category = "software-engineering"
tags = ["cpp", "rust", "ffi", "cbindgen", "form-a", "foxglove-sdk", "websocket", "cross-impl-differential"]

[verifier]
timeout_sec = 3600.0

[agent]
timeout_sec = 21600.0

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 30720

[environment.env]
# Route model calls through the take-home gateway — keep this block in every
# task you author. These values reach all phases (agent, verifier, solution).
# The agent phase gets your ANTHROPIC_API_KEY from the terminal automatically;
# if your verifier or solution also needs to call the model (e.g. an
# LLM-as-judge verifier), add:  ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
# (harbor will ask to confirm host-environment access on each run; pass -y in
# scripts).
ANTHROPIC_BASE_URL = "https://take-home-automation.vercel.app"
ANTHROPIC_API_BASE = "https://take-home-automation.vercel.app"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 30720

# Agent-editable sources only. Harbor re-materializes each entry at the same path inside the
# verifier container; tests, build files, the Rust core and reference binaries are never
# transferred (the verifier restores them from its pristine copy).
[[artifacts]]
source = "/workspace/repo/c/src"
destination = "submission/c/src"

[[artifacts]]
source = "/workspace/repo/c/include"
destination = "submission/c/include"

[[artifacts]]
source = "/workspace/repo/c/cbindgen.toml"
destination = "submission/c/cbindgen.toml"

[[artifacts]]
source = "/workspace/repo/c/cbindgen.prelude.toml"
destination = "submission/c/cbindgen.prelude.toml"

[[artifacts]]
source = "/workspace/repo/cpp/foxglove/include"
destination = "submission/cpp/foxglove/include"

[[artifacts]]
source = "/workspace/repo/cpp/foxglove/src"
destination = "submission/cpp/foxglove/src"

[[artifacts]]
source = "/workspace/repo/cpp/cmake/foxglove-sources.cmake"
destination = "submission/cpp/cmake/foxglove-sources.cmake"
