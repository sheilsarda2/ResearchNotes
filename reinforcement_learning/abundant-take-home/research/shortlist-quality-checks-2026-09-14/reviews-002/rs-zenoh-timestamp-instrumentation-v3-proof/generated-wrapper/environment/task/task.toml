version = "1.0"

[metadata]
author_name = "Abundant Candidate Research"
author_email = ""
difficulty = "hard"
category = "software-engineering"
tags = ["rust", "form-a", "zenoh", "pubsub", "wire-protocol", "codec", "latency", "cross-language-oracle"]

[verifier]
timeout_sec = 3600.0

[agent]
timeout_sec = 21600.0

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 30720

[environment.env]
# Route model calls through the take-home gateway — keep this block in every
# task you author. These values reach all phases (agent, verifier, solution).
# The agent phase gets your ANTHROPIC_API_KEY from the terminal automatically;
# if your verifier or solution also needs to call the model (e.g. an
# LLM-as-judge verifier), add:  ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
# (harbor will ask to confirm host-environment access on each run; pass -y in
# scripts).
ANTHROPIC_BASE_URL = "https://take-home-automation.vercel.app"
ANTHROPIC_API_BASE = "https://take-home-automation.vercel.app"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 30720

# Only the agent-editable crate sources are transferred; manifests, lockfile, tests,
# helper crates and reference binaries are never taken from the agent container.
[[artifacts]]
source = "/workspace/repo/commons/zenoh-protocol/src"
destination = "submission/commons/zenoh-protocol/src"

[[artifacts]]
source = "/workspace/repo/commons/zenoh-codec/src"
destination = "submission/commons/zenoh-codec/src"

[[artifacts]]
source = "/workspace/repo/zenoh/src"
destination = "submission/zenoh/src"

[[artifacts]]
source = "/workspace/repo/zenoh-ext/src"
destination = "submission/zenoh-ext/src"
