version = "1.0"

[metadata]
author_name = "Abundant Candidate Research"
author_email = ""
difficulty = "hard"
category = "software-engineering"
tags = ["rust", "form-a", "rerun", "rrd", "chunk-store", "arrow", "columnar-storage", "streaming", "optimizer", "robotics-data-infra"]

[verifier]
timeout_sec = 3600.0

[agent]
timeout_sec = 21600.0

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 8192
storage_mb = 30720

[environment.env]
# Route model calls through the take-home gateway — keep this block in every
# task you author. These values reach all phases (agent, verifier, solution).
# The agent phase gets your ANTHROPIC_API_KEY from the terminal automatically;
# if your verifier or solution also needs to call the model (e.g. an
# LLM-as-judge verifier), add:  ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
# (harbor will ask to confirm host-environment access on each run; pass -y in
# scripts).
ANTHROPIC_BASE_URL = "https://take-home-automation.vercel.app"
ANTHROPIC_API_BASE = "https://take-home-automation.vercel.app"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 3600
cpus = 4
memory_mb = 8192
storage_mb = 30720

# Only the agent-editable sources travel to the verifier; manifests, lockfile, tests, benches and
# every other crate come from the pristine tree baked into the verifier image.
[[artifacts]]
source = "/workspace/repo/crates/store/re_chunk_optimizer/src"
destination = "submission/re_chunk_optimizer/src"

[[artifacts]]
source = "/workspace/repo/crates/store/re_log_encoding/src"
destination = "submission/re_log_encoding/src"

[[artifacts]]
source = "/workspace/repo/crates/store/re_chunk_store/src"
destination = "submission/re_chunk_store/src"
