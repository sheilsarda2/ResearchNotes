schema_version = "1.3"

[metadata]
name = "diskcache-snapshot-restore"
author_name = "Abundant candidate research"
difficulty = "hard"
category = "software-engineering"
tags = ["python", "sqlite", "durability", "snapshot", "concurrency"]

[agent]
timeout_sec = 7200

[verifier]
timeout_sec = 900

[environment]
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240

[environment.env]
ANTHROPIC_BASE_URL = "https://take-home-automation.vercel.app"
ANTHROPIC_API_BASE = "https://take-home-automation.vercel.app"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240

[[artifacts]]
source = "/workspace/repo/diskcache"
destination = "submission/diskcache"
exclude = ["__pycache__", "*.pyc"]
