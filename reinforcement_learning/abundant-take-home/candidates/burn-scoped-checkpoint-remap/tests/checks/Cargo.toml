[package]
name = "burn-scoped-policy-checks"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
burn-core = { path = "/workspace/repo/crates/burn-core", default-features = false, features = ["std", "flex"] }
burn-store = { path = "/workspace/repo/crates/burn-store", default-features = false, features = ["std", "pytorch", "safetensors"] }
burn-pack = { path = "/workspace/repo/crates/burn-pack", default-features = false, features = ["std"] }
burn-std = { path = "/workspace/repo/crates/burn-std", default-features = false, features = ["std"] }
